name: Publish MatematikON 5 on GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "scripts/build-pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout complete original project
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages copy
        run: |
          python3 scripts/build-pages.py
          for f in _site/*.js; do node --check "$f"; done
          test -f _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
